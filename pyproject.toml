[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[project]
name = "easy-cut-api"
version = "0.1.0"
description = "API локальной системы интеллектуального видеомонтажа"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "celery[redis]>=5.5,<6.0",
    "fastapi>=0.115,<1.0",
    "python-dotenv>=1.2.0",
    "redis>=6.2,<6.5",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "flake8>=7.1,<8.0",
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
]

[tool.hatch.build.targets.wheel]
only-include = ["main.py", "worker.py", "services", "tasks", "sql"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "black>=25.1,<27",
    "faker>=40.43.0",
    "flake8>=7.4.1",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
]

