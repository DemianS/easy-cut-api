name: easy-cut-api

services:
  database:
    image: postgres:18-bookworm
    restart: unless-stopped
    env_file:
      - .env.database
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
